name: Compilar AEP Control para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AEPControl/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "AEPControl/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    name: Generar EXE win-x64
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore AEPControl/AEPControl.csproj

      - name: Compilar ejecutable
        run: dotnet publish AEPControl/AEPControl.csproj --configuration Release --runtime win-x64 --self-contained true --output publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Subir AEP Control v2.22 como artifact
        uses: actions/upload-artifact@v4
        with:
          name: AEP-Control-v2.22-win-x64
          path: publish/AEPControl.exe
          if-no-files-found: error
          retention-days: 30

      - name: Crear o actualizar Release v2.22
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.22"
          $asset = "publish/AEPControl.exe"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --title "AEP Control v2.22" --notes "INFO DE ITO con OCR reforzado por paneles y múltiples lecturas para matrícula, configuración y servicios. Mantiene PAX separado, EDITS, INF y ETO."
          } else {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
          }
