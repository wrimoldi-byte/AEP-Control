name: Compilar AEP Control para Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore AEPControl/AEPControl.csproj

      - name: Compilar EXE portátil
        run: dotnet publish AEPControl/AEPControl.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o salida

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: AEPControl-Windows-v0.1
          path: salida/AEPControl.exe
          if-no-files-found: error
