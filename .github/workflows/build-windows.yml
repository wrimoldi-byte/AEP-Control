name: Compilar AEP Control para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AEPControl/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Generar EXE win-x64
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore AEPControl/AEPControl.csproj

      - name: Compilar ejecutable
        run: dotnet publish AEPControl/AEPControl.csproj --configuration Release --runtime win-x64 --self-contained true --output publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Subir AEP Control v0.6
        uses: actions/upload-artifact@v4
        with:
          name: AEP-Control-v0.6-win-x64
          path: publish/AEPControl.exe
          if-no-files-found: error
          retention-days: 30
